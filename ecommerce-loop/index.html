<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
        font-family: sans-serif;
      }
      .composition-container {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: radial-gradient(circle at 50% 50%, #220015 0%, #000000 90%);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cinematic-noise {
        position: absolute;
        inset: 0;
        background: url('https://grainy-gradients.vercel.app/noise.svg');
        mix-blend-mode: overlay;
        opacity: 0.15;
        pointer-events: none;
        z-index: 10;
      }
      .glow-orb {
        position: absolute;
        width: 700px;
        height: 700px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(236, 72, 153, 0.1) 0%, transparent 70%);
        filter: blur(60px);
      }
      /* E-commerce card grid */
      .cards-scene {
        position: relative;
        width: 1000px;
        height: 500px;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 30px;
        perspective: 1000px;
      }
      .shop-card {
        width: 220px;
        height: 320px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(236, 72, 153, 0.2);
        border-radius: 12px;
        backdrop-filter: blur(8px);
        box-shadow: 0 40px 80px rgba(0,0,0,0.4);
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        will-change: transform, opacity;
      }
      .card-image-box {
        width: 100%;
        height: 160px;
        background: linear-gradient(135deg, rgba(236, 72, 153, 0.1) 0%, transparent 100%);
        border: 1px dashed rgba(236, 72, 153, 0.3);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .shopping-bag-icon {
        width: 48px;
        height: 48px;
        stroke: #EC4899;
        stroke-width: 1.5;
        fill: none;
        filter: drop-shadow(0 0 8px rgba(236,72,153,0.5));
      }
      .card-desc {
        font-family: monospace;
        font-size: 11px;
        color: rgba(255,255,255,0.4);
        letter-spacing: 1px;
      }
      .card-price {
        font-size: 24px;
        font-weight: 300;
        color: #fff;
      }
      .brand-title {
        position: absolute;
        bottom: 80px;
        font-size: 56px;
        font-weight: 300;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #FFFFFF;
        opacity: 0.85;
        text-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
        font-family: 'Plus Jakarta Sans', sans-serif;
        z-index: 6;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
      class="composition-container"
    >
      <div class="cinematic-noise"></div>
      <div class="glow-orb" id="orb-1" style="bottom: 10%; right: 10%"></div>

      <div class="cards-scene">
        <div class="shop-card" id="sc-1">
          <div class="card-image-box">
            <svg class="shopping-bag-icon" viewBox="0 0 24 24">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
              <line x1="3" y1="6" x2="21" y2="6" />
              <path d="M16 10a4 4 0 0 1-8 0" />
            </svg>
          </div>
          <div>
            <div class="card-desc">PRODUCT 01</div>
            <div class="card-price">$89.00</div>
          </div>
        </div>

        <div class="shop-card" id="sc-2" style="transform: translateZ(40px);">
          <div class="card-image-box" style="background: linear-gradient(135deg, rgba(236, 72, 153, 0.2) 0%, transparent 100%);">
            <svg class="shopping-bag-icon" viewBox="0 0 24 24" style="stroke: #FF85C0;">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
              <line x1="3" y1="6" x2="21" y2="6" />
              <path d="M16 10a4 4 0 0 1-8 0" />
            </svg>
          </div>
          <div>
            <div class="card-desc">PRODUCT 02</div>
            <div class="card-price">$120.00</div>
          </div>
        </div>

        <div class="shop-card" id="sc-3">
          <div class="card-image-box">
            <svg class="shopping-bag-icon" viewBox="0 0 24 24">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
              <line x1="3" y1="6" x2="21" y2="6" />
              <path d="M16 10a4 4 0 0 1-8 0" />
            </svg>
          </div>
          <div>
            <div class="card-desc">PRODUCT 03</div>
            <div class="card-price">$45.00</div>
          </div>
        </div>
      </div>

      <div class="brand-title">E-commerce</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.to("#orb-1", { x: -300, y: -200, duration: 6, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);

      // Staggered card entrance sweeps
      tl.from("#sc-1", { opacity: 0, x: -80, rotateY: -30, duration: 1.8, ease: "power3.out" }, 0.2);
      tl.from("#sc-2", { opacity: 0, y: 100, rotateX: 30, duration: 2.0, ease: "power3.out" }, 0);
      tl.from("#sc-3", { opacity: 0, x: 80, rotateY: 30, duration: 1.8, ease: "power3.out" }, 0.4);

      // Organic hover-style card translation looping
      tl.to("#sc-1", { y: "-=15", duration: 3, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);
      tl.to("#sc-2", { y: "+=20", duration: 3, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);
      tl.to("#sc-3", { y: "-=10", duration: 3, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);

      tl.from(".brand-title", { opacity: 0, y: 30, duration: 2.0, ease: "power3.out" }, 0.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
