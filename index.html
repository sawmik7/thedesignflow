    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thedesignflow.website/" />

    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Design Flow — Elite Design &amp; AI Automation Studio" />

    <!-- ═══════════════════════════════════════════
         SEO — Twitter / X Cards
    ═══════════════════════════════════════════ -->

    <meta name="twitter:site" content="@thedesignflow" />
    <meta name="twitter:title" content="The Design Flow | Brand Identity, SaaS UI/UX &amp; AI Automation Agency" />

         Search Console Verification
    ═══════════════════════════════════════════ -->

    ═══════════════════════════════════════════ -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.googletagmanager.com" />

      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&q=60&w=800"
      fetchpriority="high"
    />

      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&q=60&w=800"
    />

         Performance — Google Fonts (display=swap)
    ═══════════════════════════════════════════ -->
