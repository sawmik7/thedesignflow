<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
        font-family: sans-serif;
      }
      .composition-container {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: radial-gradient(circle at 50% 50%, #201200 0%, #000000 90%);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cinematic-noise {
        position: absolute;
        inset: 0;
        background: url('https://grainy-gradients.vercel.app/noise.svg');
        mix-blend-mode: overlay;
        opacity: 0.15;
        pointer-events: none;
        z-index: 10;
      }
      .glow-orb {
        position: absolute;
        width: 700px;
        height: 700px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(245, 158, 11, 0.1) 0%, transparent 70%);
        filter: blur(60px);
      }
      /* Motion circles */
      .canvas-container {
        position: relative;
        width: 800px;
        height: 500px;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .spring-circle {
        position: absolute;
        border: 2px solid #F59E0B;
        border-radius: 50%;
        filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.7));
        will-change: transform;
      }
      .brand-title {
        position: absolute;
        bottom: 80px;
        font-size: 56px;
        font-weight: 300;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #FFFFFF;
        opacity: 0.85;
        text-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        font-family: 'Plus Jakarta Sans', sans-serif;
        z-index: 6;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
      class="composition-container"
    >
      <div class="cinematic-noise"></div>
      <div class="glow-orb" id="orb-1" style="top: 10%; right: 10%"></div>

      <div class="canvas-container">
        <div class="spring-circle" id="c-1" style="width: 250px; height: 250px; border-color: #F59E0B;"></div>
        <div class="spring-circle" id="c-2" style="width: 170px; height: 170px; border-color: rgba(245, 158, 11, 0.6);"></div>
        <div class="spring-circle" id="c-3" style="width: 90px; height: 90px; border-color: rgba(245, 158, 11, 0.3);"></div>
      </div>

      <div class="brand-title">Motion Design</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.to("#orb-1", { x: -400, y: 200, duration: 6, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);

      // Multi-stage elastic animations mapping physics spring signatures
      tl.from("#c-1", { scale: 0, opacity: 0, duration: 2.2, ease: "elastic.out(1, 0.4)" }, 0);
      tl.from("#c-2", { scale: 0, opacity: 0, duration: 2.2, ease: "elastic.out(1, 0.45)" }, 0.3);
      tl.from("#c-3", { scale: 0, opacity: 0, duration: 2.2, ease: "elastic.out(1, 0.5)" }, 0.6);

      // Rotating orbital offsets
      tl.to("#c-1", { rotation: 360, x: 50, y: -20, duration: 6, ease: "none" }, 0);
      tl.to("#c-2", { rotation: -360, x: -30, y: 30, duration: 6, ease: "none" }, 0);
      tl.to("#c-3", { rotation: 180, duration: 6, ease: "none" }, 0);

      // Secondary spring breath
      tl.to(".spring-circle", { scale: 1.15, duration: 3, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);

      tl.from(".brand-title", { opacity: 0, y: 30, duration: 2.0, ease: "power3.out" }, 0.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
