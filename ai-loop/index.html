<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
        font-family: sans-serif;
      }
      .composition-container {
        position: relative;
        width: 1920px;
        height: 1080px;
        background: radial-gradient(circle at 50% 50%, #001c10 0%, #000000 90%);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cinematic-noise {
        position: absolute;
        inset: 0;
        background: url('https://grainy-gradients.vercel.app/noise.svg');
        mix-blend-mode: overlay;
        opacity: 0.15;
        pointer-events: none;
        z-index: 10;
      }
      .glow-orb {
        position: absolute;
        width: 700px;
        height: 700px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
        filter: blur(60px);
      }
      /* Node net */
      .nodes-container {
        position: relative;
        width: 900px;
        height: 500px;
        z-index: 5;
      }
      .glow-node {
        fill: #10B981;
        filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.8));
      }
      .glow-line {
        stroke: #10B981;
        stroke-width: 1.5;
        stroke-linecap: round;
        filter: drop-shadow(0 0 5px rgba(16, 185, 129, 0.4));
      }
      .brand-title {
        position: absolute;
        bottom: 80px;
        font-size: 56px;
        font-weight: 300;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #FFFFFF;
        opacity: 0.85;
        text-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        font-family: 'Plus Jakarta Sans', sans-serif;
        z-index: 6;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
      class="composition-container"
    >
      <div class="cinematic-noise"></div>
      <div class="glow-orb" id="orb-1" style="bottom: 15%; left: 15%"></div>

      <div class="nodes-container">
        <svg width="100%" height="100%" viewBox="0 0 900 500">
          <!-- Connection lines -->
          <line x1="150" y1="250" x2="350" y2="150" class="glow-line" id="line-1" stroke-dasharray="300" stroke-dashoffset="300" />
          <line x1="150" y1="250" x2="350" y2="350" class="glow-line" id="line-2" stroke-dasharray="300" stroke-dashoffset="300" />
          <line x1="350" y1="150" x2="550" y2="150" class="glow-line" id="line-3" stroke-dasharray="250" stroke-dashoffset="250" />
          <line x1="350" y1="350" x2="550" y2="350" class="glow-line" id="line-4" stroke-dasharray="250" stroke-dashoffset="250" />
          <line x1="550" y1="150" x2="750" y2="250" class="glow-line" id="line-5" stroke-dasharray="300" stroke-dashoffset="300" />
          <line x1="550" y1="350" x2="750" y2="250" class="glow-line" id="line-6" stroke-dasharray="300" stroke-dashoffset="300" />
          <line x1="350" y1="150" x2="350" y2="350" class="glow-line" id="line-7" stroke-dasharray="200" stroke-dashoffset="200" style="stroke: #059669; stroke-width: 1" />
          <line x1="550" y1="150" x2="550" y2="350" class="glow-line" id="line-8" stroke-dasharray="200" stroke-dashoffset="200" style="stroke: #059669; stroke-width: 1" />

          <!-- Glowing Nodes -->
          <circle cx="150" cy="250" r="10" class="glow-node" id="n1" />
          <circle cx="350" cy="150" r="8" class="glow-node" id="n2" />
          <circle cx="350" cy="350" r="8" class="glow-node" id="n3" />
          <circle cx="550" cy="150" r="8" class="glow-node" id="n4" />
          <circle cx="550" cy="350" r="8" class="glow-node" id="n5" />
          <circle cx="750" cy="250" r="10" class="glow-node" id="n6" />
        </svg>
      </div>

      <div class="brand-title">AI Automation</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.to("#orb-1", { x: 300, y: -200, duration: 6, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);

      // Network progressive write-in
      tl.from("#n1", { scale: 0, opacity: 0, duration: 0.8, ease: "elastic.out(1, 0.5)" }, 0);
      
      tl.to("#line-1", { strokeDashoffset: 0, duration: 1.2, ease: "power1.out" }, 0.4);
      tl.to("#line-2", { strokeDashoffset: 0, duration: 1.2, ease: "power1.out" }, 0.4);
      
      tl.from(["#n2", "#n3"], { scale: 0, opacity: 0, duration: 0.8, ease: "elastic.out(1, 0.5)", stagger: 0.1 }, 1.0);
      
      tl.to("#line-3", { strokeDashoffset: 0, duration: 1.2, ease: "power1.out" }, 1.4);
      tl.to("#line-4", { strokeDashoffset: 0, duration: 1.2, ease: "power1.out" }, 1.4);
      tl.to("#line-7", { strokeDashoffset: 0, duration: 1.0, ease: "power1.out" }, 1.5);

      tl.from(["#n4", "#n5"], { scale: 0, opacity: 0, duration: 0.8, ease: "elastic.out(1, 0.5)", stagger: 0.1 }, 2.0);

      tl.to("#line-5", { strokeDashoffset: 0, duration: 1.2, ease: "power1.out" }, 2.4);
      tl.to("#line-6", { strokeDashoffset: 0, duration: 1.2, ease: "power1.out" }, 2.4);
      tl.to("#line-8", { strokeDashoffset: 0, duration: 1.0, ease: "power1.out" }, 2.5);

      tl.from("#n6", { scale: 0, opacity: 0, duration: 0.8, ease: "elastic.out(1, 0.5)" }, 3.0);

      // Add dynamic organic floating to all nodes
      tl.to([".nodes-container"], { y: "-=15", duration: 3, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);

      tl.from(".brand-title", { opacity: 0, y: 30, duration: 2.0, ease: "power3.out" }, 0.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
